<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Danny Chan Yi Xiang</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.png" sizes="32x32">
<meta name="theme-color" content="#141613" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f1" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --bg:      oklch(0.165 0.006 150);
    --fg:      oklch(0.965 0.004 150);
    --fg-soft: oklch(0.795 0.006 150);
    --fg-faint:oklch(0.635 0.006 150);
    --line:    oklch(0.30 0.006 150);
    --accent:  oklch(0.885 0.19 128);
    --accent-ink: oklch(0.19 0.05 150);
    --display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    --sans:    'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --mono:    'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: oklch(0.975 0.004 130); --fg: oklch(0.195 0.008 150);
      --fg-soft: oklch(0.395 0.008 150); --fg-faint: oklch(0.455 0.009 150);
      --line: oklch(0.85 0.006 150); --accent: oklch(0.53 0.16 138); --accent-ink: oklch(0.99 0.01 150);
    }
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  body {
    margin: 0; min-height: 100dvh; overflow-x: hidden;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    gap: 26px; padding: clamp(28px, 8vw, 120px);
    background: var(--bg); color: var(--fg); font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--fg-faint);
  }
  .eyebrow::before { content: ""; width: 26px; height: 1px; background: var(--accent); }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 700;
    font-size: clamp(88px, 26vw, 300px); line-height: .86; letter-spacing: -0.04em;
  }
  h1 .dot { color: var(--accent); }
  p.msg { margin: 0; max-width: 46ch; font-size: clamp(16px, 1.6vw, 19px); color: var(--fg-soft); line-height: 1.55; }
  p.msg b { color: var(--fg); font-weight: 500; font-family: var(--mono); }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .links a {
    font-family: var(--mono); font-size: 13.5px; color: var(--fg-soft);
    padding: 11px 16px; border: 1px solid var(--line); text-decoration: none;
    transition: color .2s var(--ease), border-color .2s var(--ease);
  }
  .links a:hover { color: var(--accent); border-color: var(--accent); }
  .links a.home { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <span class="eyebrow">Error · route not found</span>
  <h1>404<span class="dot">.</span></h1>
  <p class="msg">The path <b id="path">that page</b> does not resolve. It may have moved, or never existed. Here is the way back.</p>
  <nav class="links" aria-label="Site">
    <a class="home" href="/">Back to start</a>
    <a href="/#experience">Experience</a>
    <a href="/#project">Project</a>
    <a href="/#skills">Skills</a>
    <a href="/#education">Education</a>
    <a href="/#contact">Contact</a>
  </nav>
  <script>
    try {
      var p = location.pathname.replace(/^\/+/, '');
      if (p) document.getElementById('path').textContent = '/' + p.slice(0, 60);
    } catch (e) {}
  </script>
</body>
</html>
